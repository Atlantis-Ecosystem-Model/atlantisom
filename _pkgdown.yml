url: http://atlantis-ecosystem-model.github.io/atlantisom/

template:
  bootstrap: 5

deploy:
  install_metadata: true

reference:
- title: "Load"
  desc: "Functions that read in output from Atlantis."
- contents:
  - starts_with("load_")
- title: "Create"
  desc: "Functions to create either fishery-independent or fishery-dependent data."
- contents:
  - create_survey_env
  - create_fishery_subset
  - create_survey
  - create_survey_diet
- title: "Sample"
  desc: "Functions to manipulate Atlantis data which signifies the truth.
   These manipulations generate sampled data for use in various estimation models."
- contents:
  - sample_ages
  - sample_diet
  - sample_fish
  - sample_fishery_totcatch
  - sample_survey_biomass
  - sample_survey_numbers
  - sample_survey_consumption
- title: "Write"
  desc: " Functions for writing output."
- contents:
  - write_meta
  - SS_write_comps
  - SS_write_EWAA
  - SS_write_ts
  - SS_write_biol
  - write_SS_ctl
  - write_SS_dat
- title: "Other"
  desc: "Need to categorize"
- contents:
  - aggregate_comps
  - aggregateData
  - aggregateDensityData
  - calc_age2length
  - calc_avgwtstage2age
  - calc_biomass_age
  - calc_biomass_pool
  - calc_pred_diet
  - calc_stage2age
  - calc_timestep2time
  - calc_pred_cons
  - calc_Z
  - get_boundary
  - om_comps
  - om_diet
  - om_index
  - om_init
  - om_species
  - om_consindex
  - read_savedsurvs
  - read_savedfisheries
  - reformat_compositions
  - run_stocksynthesis
  - run_truth



